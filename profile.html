<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - LoadLink</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 60px auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 32px;
            z-index: 10;
            position: relative;
            padding: 0 5%;
        }

        .profile-card {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 36px;
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            text-align: center;
            height: fit-content;
            position: relative;
            overflow: hidden;
        }
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent-gradient);
        }
        
        .profile-avatar {
            width: 96px;
            height: 96px;
            background: var(--accent-gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .profile-name { font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .profile-role {
            display: inline-block;
            background: var(--primary-light);
            padding: 4px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .profile-contact { 
            font-size: 15px; 
            color: var(--text-muted); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
        }

        .dashboard-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .dashboard-section {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
        }
        .dashboard-section:hover {
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }
        .section-title i {
            color: var(--primary-color);
        }

        .list-item {
            padding: 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition-fast);
        }
        .list-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        
        .list-info h4 { color: var(--text-main); font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .list-info h4 i { color: var(--primary-color); }
        .list-info p { color: var(--text-muted); font-size: 14px; }
        
        .booking-badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: white;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            transition: all var(--transition-fast);
        }
        .booking-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
        }

        @media (max-width: 768px) {
            .profile-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="container1" id="main-header">
        <div class="left">
            <a href="index.html" class="logo"><i class="fa-solid fa-truck-fast"></i></a>
            <span class="brand">Load<span class="gradient-text">Link</span></span>
        </div>
        <ul class="right" id="nav-links">
            <li><a href="post-vehicle.html">Post Vehicle</a></li>
            <li><a href="post-load.html">Post Load</a></li>
            <li><a href="loard-board.html">Load Board</a></li>
            <li id="nav-user-menu" class="user-menu hidden">
                <span class="user-name"><i class="fa-solid fa-circle-user"></i> <span id="user-display">User</span></span>
                <button id="nav-logout" class="logout-btn">Logout</button>
            </li>
            <li><button id="theme-toggle" class="theme-toggle"><i class="fa-solid fa-moon"></i></button></li>
        </ul>
        <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="animated-bg">
        <div class="blob"></div><div class="blob"></div><div class="blob"></div>
    </div>

    <div class="profile-container fade-up">
        
        <!-- Sidebar -->
        <div class="profile-card">
            <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
            <div class="profile-name" id="p-name">Loading...</div>
            <div class="profile-role" id="p-role">Role</div>
            <div class="profile-contact"><i class="fa-solid fa-phone"></i> <span id="p-contact">---</span></div>
        </div>

        <!-- Main Dashboard -->
        <div class="dashboard-content">
            
            <div class="dashboard-section">
                <div class="section-title"><i class="fa-solid fa-bell"></i> Incoming Booking Requests</div>
                <div id="bookings-list">
                    <p style="color:var(--text-muted); font-size:14px;">No incoming requests yet.</p>
                </div>
            </div>

            <div class="dashboard-section">
                <div class="section-title"><i class="fa-solid fa-layer-group"></i> My Active Postings</div>
                <div id="posts-list">
                    <p style="color:var(--text-muted); font-size:14px;">You haven't posted anything yet.</p>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const sessionStr = localStorage.getItem('currentUser');
            if(!sessionStr) return;
            
            const user = JSON.parse(sessionStr);

            document.getElementById('p-name').innerText = user.name;
            document.getElementById('p-role').innerText = user.role;
            document.getElementById('p-contact').innerText = user.mobile;

            try {
                const postRes = await fetch(`/api/user/${user.id}/posts`);
                const postData = await postRes.json();
                const postsList = document.getElementById('posts-list');
                
                if (postData.data && postData.data.length > 0) {
                    postsList.innerHTML = '';
                    postData.data.forEach(item => {
                        const isLoad = item._type === 'load';
                        const name = isLoad ? item.shop_name : item.driver_name;
                        const route = isLoad ? `${item.pickup_area} ➝ ${item.drop_area}` : `${item.current_area} ➝ ${item.destination_area}`;
                        
                        postsList.innerHTML += `
                            <div class="list-item">
                                <div class="list-info">
                                    <h4><i class="fa-solid ${isLoad ? 'fa-box' : 'fa-truck'}"></i> ${isLoad ? 'Load' : 'Vehicle'} - ${name}</h4>
                                    <p>${route}</p>
                                    <p style="font-size:12px; margin-top:4px;">Posted: ${new Date(item.created_at).toLocaleDateString()}</p>
                                </div>
                            </div>
                        `;
                    });
                }

                const bookRes = await fetch(`/api/user/${user.id}/bookings`);
                const bookData = await bookRes.json();
                const booksList = document.getElementById('bookings-list');

                if (bookData.data && bookData.data.length > 0) {
                    booksList.innerHTML = '';
                    bookData.data.forEach(b => {
                        const contactLink = `https://wa.me/91${b.requestor_mobile}`;
                        booksList.innerHTML += `
                            <div class="list-item" style="border-left: 4px solid var(--primary-color);">
                                <div class="list-info">
                                    <h4><i class="fa-solid fa-user-tag"></i> Interest for your ${b.post_type}</h4>
                                    <p><strong>${b.requestor_name}</strong> wants to connect regarding your recent post.</p>
                                    <p style="font-size:12px; margin-top:4px;">Requested: ${new Date(b.created_at).toLocaleDateString()}</p>
                                </div>
                                <div class="list-action">
                                    <a href="${contactLink}" target="_blank" class="booking-badge" style="text-decoration:none;">
                                        <i class="fa-brands fa-whatsapp"></i> Chat Now
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                }

            } catch (err) {
                console.error('Error loading dashboard:', err);
            }
        });
    </script>
</body>
</html>
